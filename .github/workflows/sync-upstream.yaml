name: Sync Upstream Nixpkgs

on:
  schedule:
    - cron: '0 9 * * 2' # Runs Tuesday morning UTC
  workflow_dispatch:

jobs:
  sync-nixpkgs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Fork
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: nixpkgs-unstable
          fetch-depth: 0 # Required to fetch full history so git merge evaluates correctly

      - name: Configure Git Bot Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set Upstream and Fetch
        run: |
          git remote add upstream https://github.com/nixos/nixpkgs.git
          git fetch upstream nixpkgs-unstable

      - name: Merge Upstream Changes Locally
        run: |
          git merge upstream/nixpkgs-unstable --no-edit

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sync/nixpkgs-unstable
          base: nixpkgs-unstable
          title: "chore(nixpkgs): sync with upstream nixpkgs-unstable"
          body: |
            Automated PR tracking the latest updates from `nixos/nixpkgs:nixpkgs-unstable`.
          labels: |
            sync
