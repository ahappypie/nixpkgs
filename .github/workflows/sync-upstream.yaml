name: Sync Upstream Nixpkgs

on:
  schedule:
    - cron: '0 9 * * 2' # Runs Tuesday morning UTC
  workflow_dispatch: # Allows manual execution from the UI/CLI
  push:
    branches:
      - nixpkgs-unstable

jobs:
  server-side-upstream-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Sync tracking branch with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "sync fork nixpkgs-unstable with upstream..."

          RESPONSE=$(gh api --method POST /repos/${{ github.repository }}/merge-upstream \
            -F branch="nixpkgs-unstable" --silent --output /dev/null -w "%{http_code}" || echo "failed")

          if [ "$RESPONSE" == "200" ] || [ "$RESPONSE" == "204" ]; then
            echo "✅ Successfully synced nixpkgs-unstable with upstream!"
          elif [ "$RESPONSE" == "409" ]; then
            echo "⚠️ Conflict detected upstream. Manual intervention required."
            exit 1
          else
            echo "ℹ️ Branch already up to date or API completed."
          fi

      - name: Check and Propose Merge to Feature Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEATURE_BRANCH: "fix/vscode-with-extensions-macos-path"
        run: |
          echo "checking if an active PR already exists from nixpkgs-unstable to $FEATURE_BRANCH..."

          EXISTING_PR=$(gh pr list --repo ${{ github.repository }} \
            --base "$FEATURE_BRANCH" \
            --head "nixpkgs-unstable" \
            --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "ℹ️ Pull Request #$EXISTING_PR is already open. GitHub will update it automatically."
          else
            echo "🚀 No active PR found. Creating a new PR..."
            gh pr create --repo ${{ github.repository }} \
              --base "$FEATURE_BRANCH" \
              --head "nixpkgs-unstable" \
              --title "chore(nixpkgs): merge upstream updates into $FEATURE_BRANCH" \
              --body "Automated PR proposing latest changes from upstream \`nixpkgs-unstable\`."
          fi
